---
layout: default
---
<!-- _layouts/cv.html
     The CV is maintained only as a PDF (assets/pdf/<page.cv_pdf>), so there is a single
     source of truth. On wide screens the PDF is shown inline; on phones (where embedded
     PDFs render poorly) a button opens it in the device's own PDF viewer. -->
{%- assign cv_url = page.cv_pdf | prepend: 'assets/pdf/' | relative_url -%}
        <div class="post">

          <header class="post-header cv-header">
            <h1 class="post-title">{{ page.title }}</h1>
            {%- if page.cv_pdf %}
            <a class="cv-download" href="{{ cv_url }}" target="_blank" rel="noopener noreferrer"><i class="fas fa-file-pdf"></i> Download PDF</a>
            {%- endif %}
          </header>

          <article>
            {%- if page.cv_pdf %}
            <div class="cv-embed">
              <iframe src="{{ cv_url }}#navpanes=0&view=FitH" title="Curriculum vitae of {{ site.title }} (PDF)"></iframe>
            </div>
            <p class="cv-mobile">
              <a class="cv-download" href="{{ cv_url }}" target="_blank" rel="noopener noreferrer"><i class="fas fa-file-pdf"></i> Open CV (PDF)</a>
            </p>
            {%- endif %}
            {{ content }}
          </article>

        </div>
